[package]
name = "spike-transcriber"
version = "0.1.0"
edition = "2021"

[dependencies]
transcribe-rs = { version = "0.3", features = ["onnx"] }
# transcribe-rs 0.3.12 объявляет ort "2.0.0-rc.12" диапазоном, но в rc.14
# у ort сломан API Session::builder — пинтуем точно.
ort = "=2.0.0-rc.12"
polyvoice = { version = "1.0", features = ["pipeline-native", "vbx"] }
hound = "3"
symphonia = { version = "0.5", features = ["all"] }
audiopus = "0.2"
rubato = "0.16"
serde_json = "1"
anyhow = "1"

# Крейт спайка намеренно не входит ни в один workspace.
[workspace]
